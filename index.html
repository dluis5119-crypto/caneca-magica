
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caneca Mágica | Entre Laços</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff0f5;
    }
    .mensagem {
      position: fixed;
      top: 12px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 10;
      color: #9d315e;
      font-weight: bold;
      padding: 12px;
    }
    a-scene {
      position: fixed;
      inset: 0;
    }
  </style>
</head>
<body>
  <div class="mensagem">
    ❤️ Entre Laços — Aponte para a foto e viva a surpresa!
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;
    autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video
        id="video"
        src="./video.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera position="0 0 0"
      look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-video
        src="#video"
        width="1"
        height="0.5625"
        position="0 0 0.05"
        rotation="0 0 0">
      </a-video>
    </a-entity>

    <script>
      const cena = document.querySelector("a-scene");

      cena.addEventListener("targetFound", () => {
        const video = document.querySelector("#video");
        video.play().catch(() => {
          console.log("Toque na tela para iniciar o vídeo.");
        });
      });

      cena.addEventListener("targetLost", () => {
        const video = document.querySelector("#video");
        video.pause();
        video.currentTime = 0;
      });
    </script>
  </a-scene>
</body>
</html>
